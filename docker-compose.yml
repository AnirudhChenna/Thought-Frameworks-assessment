version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: support_ticket_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword123
      MYSQL_DATABASE: support_ticket_db
      MYSQL_USER: ticket_user
      MYSQL_PASSWORD: ticket_pass_123
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    networks:
      - support_network

  # Backend REST API Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: support_ticket_backend
    restart: unless-stopped
    depends_on:
      - mysql
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword123
      DB_NAME: support_ticket_db
      JWT_SECRET: production_jwt_secret_token_change_in_real_env_2026
      JWT_EXPIRES_IN: 7d
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    networks:
      - support_network

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: support_ticket_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - support_network

volumes:
  mysql_data:

networks:
  support_network:
    driver: bridge
